<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d4ee8"><title>Entrar • Nossa Agenda</title><link rel="stylesheet" href="/static/style.css"><link rel="manifest" href="/manifest.webmanifest"></head><body class="login-body"><main class="login-box"><div class="logo-mark">✦</div><h1>Nossa Agenda</h1><p>Todos os compromissos da família em um lugar.</p>{% if error %}<div class="alert">{{error}}</div>{% endif %}<form method="post" action="/login"><input type="hidden" name="token" value="{{csrf}}"><label>E-mail<input type="email" name="email" autocomplete="username" required placeholder="voce@exemplo.com"></label><label>Senha<input type="password" name="password" autocomplete="current-password" required placeholder="Sua senha"></label><button class="btn primary full">Entrar na agenda</button></form><small>Acesso privado para os membros cadastrados.</small></main></body></html>
